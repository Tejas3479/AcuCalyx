version: '3.8'

services:
  acucalyx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acucalyx_cds_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ACUCALYX_ENV=production
      - ACUCALYX_REQUIRE_AUTH=1
      - ACUCALYX_AUTH_SECRET=ACUCALYX_SECURE_SURGICAL_JWT_PROD_DEPLOYMENT_KEY_2026
      - ACUCALYX_DEID_SECRET=ACUCALYX_SECURE_DEID_HMAC_PROD_DEPLOYMENT_KEY_2026
      - ACUCALYX_LOG_LEVEL=INFO
    volumes:
      - ./data/cases:/app/data/cases
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
