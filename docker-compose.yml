version: '3.8'

services:
  acucalyx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acucalyx_cds_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ACUCALYX_ENV=production
      - ACUCALYX_REQUIRE_AUTH=1
      - ACUCALYX_AUTH_SECRET=${ACUCALYX_AUTH_SECRET:?Production Error: ACUCALYX_AUTH_SECRET must be set with openssl rand -hex 32}
      - ACUCALYX_DEID_SECRET=${ACUCALYX_DEID_SECRET:?Production Error: ACUCALYX_DEID_SECRET must be set with openssl rand -hex 32}
      - ACUCALYX_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
