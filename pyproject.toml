[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acucalyx"
version = "2.1.0"
description = "Patient-Specific Computational Planning for PCNL Access & Fluoroscopy Projection Simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary / Research Use Only" }
authors = [
    { name = "AcuCalyx Research Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydicom>=2.4.0",
    "SimpleITK>=2.3.0",
    "nibabel>=5.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-image>=0.21.0",
    "trimesh>=4.0.0",
    "rtree>=1.0.0",
    "shapely>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.4.0",
    "pyyaml>=6.0.1",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.80.0",
    "httpx>=0.25.0",
]

[project.scripts]
acucalyx = "acucalyx.cli:main"
acucalyx-server = "app.api.main:run_server"
acucalyx-plan = "acucalyx.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["acucalyx*", "app*"]

[tool.setuptools.package-data]
"app.frontend" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
